<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Water and electricity consumption rate for headquarters</title>
    <meta name="description" content="A comprehensive utility consumption tracking dashboard for water, electricity, and HVAC across multiple sites with automatic calculations." />
    <meta property="og:title" content="Water and electricity consumption rate for headquarters" />
    <meta property="og:description" content="A comprehensive utility consumption tracking dashboard for water, electricity, and HVAC across multiple sites with automatic calculations." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Tajawal', sans-serif;
      }
      /* Hide number input spinners */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }
      input[type=number] {
        -moz-appearance: textfield;
      }

      /* Print Specific Styles */
      @media print {
        @page {
          size: landscape;
          margin: 0;
        }
        body {
          margin: 0;
          padding: 0.5cm;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          background-color: white;
        }
        /* Ensure inputs look like text */
        input, textarea {
          border: none !important;
          background: transparent !important;
          resize: none;
          box-shadow: none !important;
        }
        /* Ensure table fits */
        .overflow-x-auto {
          overflow: visible !important;
        }
        /* Custom hide class that ensures display none acts correctly */
        .print\:hidden {
          display: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 text-slate-800">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
